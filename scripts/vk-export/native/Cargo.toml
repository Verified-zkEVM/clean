[package]
name = "midnight-vk-export-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
publish = false

# Expects midnight-zk at 1e39c120 next to this repository (../midnight-zk).
[dependencies]
midnight-proofs = { path = "../../../../midnight-zk/proofs", default-features = false, features = ["circuit-params", "committed-instances"] }
midnight-curves = { path = "../../../../midnight-zk/curves" }
midnight-circuits = { path = "../../../../midnight-zk/circuits" }
midnight-zk-stdlib = { path = "../../../../midnight-zk/zk_stdlib" }
ff = "0.13"
group = "0.13"
blake2b_simd = "1"
# Exact decimal constants in witgen.json.
serde_json = { version = "1", features = ["arbitrary_precision"] }
num-bigint = "0.4"
sha2 = "0.10.9"
rand_core = { version = "0.6", features = ["getrandom"] }

