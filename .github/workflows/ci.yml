name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Check for consecutive empty lines
        run: python3 scripts/check-consecutive-empty-lines.py
      - name: Install snarkjs and wabt (wasm-validate / wasm2wat)
        run: |
          npm install -g snarkjs
          sudo apt-get update
          sudo apt-get install -y wabt
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
      - name: Build tests
        # CleanTests shells out to snarkjs / wasm-validate; without them the
        # affected checks print SKIP instead of failing.
        run: lake build CleanTests

  plonky3-backend:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check generated Rust artifacts
        shell: bash
        run: |
          lake exe export_fibonacci_ensemble_rust \
            | rustfmt --edition 2021 --emit stdout \
            > backends/plonky3/tests/generated/fibonacci_ensemble.rs
          lake exe export_femtocairo_flat_air_rust \
            | rustfmt --edition 2021 --emit stdout \
            > backends/plonky3/tests/generated/femtocairo_flat_air.rs
          lake exe export_witness_ir_reference_rust \
            | rustfmt --edition 2021 --emit stdout \
            > backends/plonky3/tests/generated/witness_ir_reference.rs
          git diff --exit-code -- backends/plonky3/tests/generated
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backends/plonky3/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backends/plonky3/Cargo.lock') }}
      - name: Run plonky3 tests
        working-directory: backends/plonky3
        run: |
          cargo test --locked --release --test fibonacci_ensemble_tests -- --nocapture
          cargo test --locked --release --test femtocairo_flat_air_tests -- --nocapture
          cargo test --locked --release --test witness_ir_reference_tests
